<!doctype html>
<html lang="tr">
  <head>
    <link rel="icon" href="assets/wordigo-icon.png" type="image/png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wordigo - Kelime Ekle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
      }
      /* Sidebar kaydırma çubuğunu gizleme */
      aside::-webkit-scrollbar {
        display: none;
      }
      aside {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body class="bg-slate-50">
    <div class="flex min-h-screen">
      
      <aside
        class="w-72 bg-white border-r border-slate-200 hidden md:flex flex-col sticky top-0 h-screen overflow-y-auto no-print shadow-sm"
      >
        <div class="p-6">
          <div class="flex items-center gap-3 px-2">
            <div
              class="w-10 h-10 bg-amber-400 rounded-xl flex items-center justify-center shadow-lg shadow-amber-200"
            >
              <span class="text-white text-xl font-bold">W</span>
            </div>
            <span class="text-xl font-bold text-slate-800 tracking-tight"
              >wordigo</span
            >
          </div>
        </div>

        <nav class="px-4 space-y-1 mb-8">
          <a
            href="dashboard.html"
            class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-50 rounded-xl transition font-medium"
            >🏠 Ana Sayfa</a
          >
          <a
            href="dictionary.html"
            class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-50 rounded-xl transition font-medium"
            >📖 Sözlük</a
          >
          <a
            href="add-word.html"
            class="flex items-center gap-3 px-4 py-3 text-amber-600 bg-amber-50 rounded-xl font-semibold transition"
            >➕ Kelime Ekle</a
          >
          <a
  href="settings.html"
  class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-50 rounded-xl transition font-medium"
>
  ⚙️ Ayarlar
</a>  
        </nav>

        <div class="px-4 mb-4 mt-auto">
          <a
            href="word-chain.html"
            class="group block bg-gradient-to-br from-indigo-500 to-purple-600 rounded-3xl p-5 text-white relative overflow-hidden shadow-lg shadow-indigo-200/50 transition-all duration-300 hover:-translate-y-1"
          >
            <div class="absolute -right-4 -top-4 w-24 h-24 bg-white/10 rounded-full blur-xl transition-transform group-hover:scale-150"></div>
            
            <h4 class="text-[10px] font-bold text-indigo-100 uppercase tracking-widest mb-1">✨ Yapay Zeka</h4>
            <h3 class="text-xl font-bold mb-1">Word Chain</h3>
            <p class="text-xs text-indigo-50/90 font-medium leading-relaxed mb-4">
              Kelime Zinciri ile bir hikaye oluştur.
            </p>
            
            <div class="flex items-center justify-between">
              <span class="text-2xl group-hover:rotate-12 transition-transform duration-300">🤖</span>
              <span class="bg-white/20 backdrop-blur-md px-3 py-2 rounded-xl text-[11px] font-bold shadow-sm group-hover:bg-white/30 transition-colors">
                Hikaye Oluştur
              </span>
            </div>
          </a>
        </div>

        <div class="p-4 border-t border-slate-100">
          <button
            id="logoutBtn"
            class="w-full flex items-center gap-3 px-4 py-3 text-red-500 hover:bg-red-50 rounded-xl transition font-medium"
          >
            🚪 Oturumu Kapat
          </button>
        </div>
      </aside>

      <main class="flex-1 p-8">
        <div class="max-w-5xl mx-auto">
          
          <header class="mb-8 flex items-center justify-between bg-white/80 backdrop-blur-md p-6 rounded-[32px] border border-slate-200 shadow-sm">
            <div>
              <h1 class="text-2xl font-bold text-slate-800">Yeni Kelime Ekle</h1>
              <p class="text-slate-500 text-sm mt-1">
                Hafızana yeni bir değer katmaya hazır mısın?
              </p>
            </div>
          </header>

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-10 items-start">
            
            <form
              id="addWordForm"
              class="bg-white p-8 rounded-[32px] shadow-sm border border-slate-200 space-y-6"
            >
              <div>
                <label class="block text-[13px] font-bold text-slate-700 mb-2 uppercase tracking-wide"
                  >İngilizce Kelime</label
                >
                <input
                  type="text"
                  id="engWord"
                  required
                  placeholder="Örn: Resilience"
                  class="w-full px-5 py-4 bg-slate-50 rounded-2xl border border-slate-200 focus:bg-white focus:border-amber-400 focus:ring-4 focus:ring-amber-500/10 outline-none transition text-slate-700 font-medium"
                />
              </div>

              <div>
                <label class="block text-[13px] font-bold text-slate-700 mb-2 uppercase tracking-wide"
                  >Türkçe Karşılığı</label
                >
                <input
                  type="text"
                  id="turWord"
                  required
                  placeholder="Örn: Direnç"
                  class="w-full px-5 py-4 bg-slate-50 rounded-2xl border border-slate-200 focus:bg-white focus:border-amber-400 focus:ring-4 focus:ring-amber-500/10 outline-none transition text-slate-700 font-medium"
                />
              </div>

              <div>
                <label class="block text-[13px] font-bold text-slate-700 mb-2 uppercase tracking-wide"
                  >Örnek Cümle (İsteğe Bağlı)</label
                >
                <textarea
                  id="sentence"
                  rows="3"
                  placeholder="Kelimeyi bir cümle içinde kullan..."
                  class="w-full px-5 py-4 bg-slate-50 rounded-2xl border border-slate-200 focus:bg-white focus:border-amber-400 focus:ring-4 focus:ring-amber-500/10 outline-none transition text-slate-700 font-medium resize-none"
                ></textarea>
              </div>

              <div>
                <label class="block text-[13px] font-bold text-slate-700 mb-2 uppercase tracking-wide"
                  >Resim URL (İsteğe Bağlı)</label
                >
                <input
                  type="text"
                  id="picUrl"
                  placeholder="https://resim-adresi.com/resim.jpg"
                  class="w-full px-5 py-4 bg-slate-50 rounded-2xl border border-slate-200 focus:bg-white focus:border-amber-400 focus:ring-4 focus:ring-amber-500/10 outline-none transition text-slate-700 font-medium"
                />
              </div>

              <button
                type="submit"
                class="w-full py-4 mt-2 bg-amber-400 text-white text-lg font-bold rounded-2xl hover:bg-amber-500 shadow-lg shadow-amber-200 transition-all transform hover:-translate-y-0.5 active:scale-95"
              >
                Ekle
              </button>
            </form>

            <div class="hidden lg:block sticky top-8">
              <div class="mb-4 px-2">
                <p class="text-[11px] font-bold text-slate-400 uppercase tracking-widest text-center">
                  Canlı Önizleme
                </p>
              </div>
              
              <div class="bg-white border border-slate-200 rounded-[24px] p-5 shadow-lg shadow-slate-200/50 flex flex-col max-w-sm mx-auto transition-all">
                
                <div id="previewPicBox" class="w-full aspect-square rounded-[18px] bg-slate-50/80 border border-slate-100 mb-4 flex items-center justify-center p-2 overflow-hidden text-slate-400 text-sm italic">
                  <span>Görsel bekleniyor...</span>
                  <img id="previewPic" src="" class="w-full h-full object-contain hidden" />
                </div>
                
                <div class="text-center">
                  <h3 id="previewEng" class="text-xl font-bold text-slate-800 uppercase tracking-wide">KELİME</h3>
                  <p id="previewTur" class="text-slate-500 text-[13px] font-medium mt-1">Anlamı</p>
                </div>
                
                <div class="bg-slate-50 rounded-xl p-3 border border-slate-100 text-center mt-4 min-h-[48px] flex items-center justify-center">
                  <p id="previewSentence" class="text-amber-600 text-xs italic">
                    "Örnek cümle burada görünecek."
                  </p>
                </div>

              </div>
            </div>

          </div>
        </div>
      </main>
    </div>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/add-word.js"></script>
  </body>
</html>
