<!doctype html>
<html lang="tr">
  <head>
    <link rel="icon" href="assets/wordigo-icon.png" type="image/png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wordigo - Ayarlar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body { font-family: "Plus Jakarta Sans", sans-serif; }
      aside::-webkit-scrollbar { display: none; }
      aside { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
  </head>
  <body class="bg-slate-50">
    <div class="flex min-h-screen">
      
      <aside class="w-72 bg-white border-r border-slate-200 hidden md:flex flex-col sticky top-0 h-screen overflow-y-auto no-print shadow-sm">
        <div class="p-6">
          <div class="flex items-center gap-3 px-2">
            <div class="w-10 h-10 bg-amber-400 rounded-xl flex items-center justify-center shadow-lg shadow-amber-200">
              <span class="text-white text-xl font-bold">W</span>
            </div>
            <span class="text-xl font-bold text-slate-800 tracking-tight">wordigo</span>
          </div>
        </div>

        <nav class="px-4 space-y-1 mb-8">
          <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-50 rounded-xl transition font-medium">🏠 Ana Sayfa</a>
          <a href="dictionary.html" class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-50 rounded-xl transition font-medium">📖 Sözlük</a>
          <a href="add-word.html" class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-50 rounded-xl transition font-medium">➕ Kelime Ekle</a>
          <a href="settings.html" class="flex items-center gap-3 px-4 py-3 text-amber-600 bg-amber-50 rounded-xl font-semibold transition mt-2">⚙️ Ayarlar</a>
        </nav>

        <div class="px-4 mb-4 mt-auto">
          <a href="word-chain.html" class="group block bg-gradient-to-br from-indigo-500 to-purple-600 rounded-3xl p-5 text-white relative overflow-hidden shadow-lg shadow-indigo-200/50 transition-all duration-300 hover:-translate-y-1">
            <div class="absolute -right-4 -top-4 w-24 h-24 bg-white/10 rounded-full blur-xl transition-transform group-hover:scale-150"></div>
            <h4 class="text-[10px] font-bold text-indigo-100 uppercase tracking-widest mb-1">✨ Yapay Zeka</h4>
            <h3 class="text-xl font-bold mb-1">Word Chain</h3>
            <p class="text-xs text-indigo-50/90 font-medium leading-relaxed mb-4">Kelime Zinciri ile bir hikaye oluştur.</p>
            <div class="flex items-center justify-between">
              <span class="text-2xl group-hover:rotate-12 transition-transform duration-300">🤖</span>
              <span class="bg-white/20 backdrop-blur-md px-3 py-2 rounded-xl text-[11px] font-bold shadow-sm group-hover:bg-white/30 transition-colors">Hikaye Oluştur</span>
            </div>
          </a>
        </div>

        <div class="p-4 border-t border-slate-100">
          <button id="logoutBtn" class="w-full flex items-center gap-3 px-4 py-3 text-red-500 hover:bg-red-50 rounded-xl transition font-medium">
            🚪 Oturumu Kapat
          </button>
        </div>
      </aside>

      <main class="flex-1 p-8">
        <div class="max-w-3xl mx-auto">
          
          <header class="mb-8 flex items-center justify-between bg-white/80 backdrop-blur-md p-6 rounded-[32px] border border-slate-200 shadow-sm">
            <div>
              <h1 class="text-2xl font-bold text-slate-800">Ayarlar ⚙️</h1>
              <p class="text-slate-500 text-sm mt-1">Öğrenme deneyimini kendine göre kişiselleştir.</p>
            </div>
          </header>

          <div class="bg-white p-8 rounded-[32px] shadow-sm border border-slate-200 space-y-8">
            
            <div>
              <h2 class="text-lg font-bold text-slate-800 mb-6 flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-amber-400"></span> Sınav Tercihleri
              </h2>
              
              <div class="bg-slate-50 p-6 rounded-2xl border border-slate-100">
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                  <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Günlük Yeni Kelime Sınırı</label>
                    <p class="text-[13px] text-slate-500">Sınavlarda karşına çıkacak kelime sayısı.</p>
                  </div>
                  
                  <div class="flex items-center gap-3 bg-white p-2 rounded-xl border border-slate-200 shadow-sm">
                    <button id="decreaseWordLimitBtn" class="w-10 h-10 flex items-center justify-center rounded-lg bg-slate-50 text-slate-600 hover:bg-slate-100 transition font-bold text-xl">-</button>
                    <input type="number" id="wordLimitInput" value="10" min="5" max="50" class="w-16 text-center text-lg font-bold text-slate-800 outline-none bg-transparent" readonly>
                    <button id="increaseWordLimitBtn" class="w-10 h-10 flex items-center justify-center rounded-lg bg-amber-50 text-amber-600 hover:bg-amber-100 transition font-bold text-xl">+</button>
                  </div>
                </div>
              </div>
            </div>

            <hr class="border-slate-100">

            <div class="flex items-center justify-between">
              <p id="saveNotification" class="text-emerald-600 text-sm font-bold opacity-0 transition-opacity flex items-center gap-2">
                <span>✅</span> Ayarlar başarıyla kaydedildi!
              </p>
              <button id="saveSettingsBtn" class="px-8 py-4 bg-slate-800 text-white font-bold rounded-2xl hover:bg-slate-700 shadow-lg shadow-slate-200 transition-all transform hover:-translate-y-0.5 active:scale-95">
                Değişiklikleri Kaydet
              </button>
            </div>

          </div>
        </div>
      </main>
    </div>
    <script src="js/config.js"></script>
    <script src="js/settings.js"></script>
  </body>
</html>
