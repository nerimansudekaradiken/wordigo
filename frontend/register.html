<!doctype html>
<html lang="tr">
  <head>
    <link rel="icon" href="assets/wordigo-icon.png" type="image/png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wordigo - Kayıt Ol</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="bg-slate-50 flex items-center justify-center min-h-screen p-4">
    <div
      class="login-container w-full max-w-[480px] bg-white rounded-[2rem] shadow-2xl shadow-slate-200/50 border border-slate-100 overflow-hidden"
    >
      <div class="h-2 bg-amber-400 w-full"></div>

      <div class="p-10">
        <div class="flex flex-col items-center mb-8">
          <div
            class="w-14 h-14 bg-amber-400 rounded-2xl flex items-center justify-center shadow-lg shadow-amber-200 mb-4"
          >
            <span class="text-white text-2xl font-bold">W</span>
          </div>
          <h1 class="text-2xl font-bold text-slate-800">Hesap Oluştur</h1>
          <p class="text-slate-500 text-sm text-center mt-2">
            Kendi kelime havuzunu oluşturmaya başlamak için aramıza katıl.
          </p>
        </div>

        <form id="registerForm" class="space-y-5">
          <div class="space-y-2">
            <label class="text-sm font-semibold text-slate-700 ml-1"
              >Kullanıcı Adı</label
            >
            <input
              type="text"
              id="regUsername"
              required
              class="w-full px-5 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-amber-400 focus:border-transparent outline-none transition-all"
              placeholder="Örn: kelime_avcisi"
            />
          </div>

          <div class="space-y-2">
            <label class="text-sm font-semibold text-slate-700 ml-1"
              >E-posta</label
            >
            <input
              type="email"
              id="regEmail"
              required
              class="w-full px-5 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-amber-400 focus:border-transparent outline-none transition-all"
              placeholder="isim@mail.com"
            />
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div class="space-y-2">
              <label class="text-sm font-semibold text-slate-700 ml-1"
                >Şifre</label
              >
              <input
                type="password"
                id="regPassword"
                required
                class="w-full px-5 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-amber-400 focus:border-transparent outline-none transition-all"
                placeholder="••••••••"
              />
            </div>
            <div class="space-y-2">
              <label class="text-sm font-semibold text-slate-700 ml-1"
                >Tekrar Şifre</label
              >
              <input
                type="password"
                id="regPasswordConfirm"
                required
                class="w-full px-5 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-amber-400 focus:border-transparent outline-none transition-all"
                placeholder="••••••••"
              />
            </div>
          </div>

          <div class="flex items-start gap-2 px-1">
            <input
              type="checkbox"
              id="terms"
              required
              class="mt-1 accent-amber-500"
            />
            <label for="terms" class="text-xs text-slate-500 leading-tight">
              Kullanım şartlarını ve gizlilik politikasını kabul ediyorum.
            </label>
          </div>

          <button
            type="submit"
            class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-4 rounded-2xl transition-all shadow-lg shadow-slate-200 mt-4 flex items-center justify-center gap-2"
          >
            Kayıt İşlemini Tamamla
            <span class="text-xl">✨</span>
          </button>
        </form>

        <div class="mt-8 text-center">
          <p class="text-sm text-slate-500">
            Zaten hesabın var mı?
            <a
              href="login.html"
              class="text-amber-600 font-bold hover:underline"
              >Giriş Yap</a
            >
          </p>
        </div>
      </div>
    </div>
    <script src="js/config.js"></script>
    <script src="js/register.js"></script>
  </body>
</html>
