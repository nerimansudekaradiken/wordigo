<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wordigo - Wordle Bulmacası</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
      }
      .wordle-tile {
        width: 50px;
        height: 50px;
        border: 2px solid #e2e8f0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        font-weight: bold;
        text-transform: uppercase;
        border-radius: 12px;
        transition: all 0.2s;
      }
      .tile-correct {
        background-color: #22c55e;
        border-color: #22c55e;
        color: white;
      }
      .tile-present {
        background-color: #fbbf24;
        border-color: #fbbf24;
        color: white;
      }
      .tile-absent {
        background-color: #94a3b8;
        border-color: #94a3b8;
        color: white;
      }
      .tile-active {
        border-color: #fbbf24;
        transform: scale(1.05);
      }
    </style>
  </head>
  <body class="bg-slate-50 min-h-screen flex flex-col">
    <header
      class="h-20 bg-white border-b border-slate-200 flex items-center justify-between px-8 sticky top-0 z-10"
    >
      <div class="flex items-center gap-3">
        <div
          class="w-10 h-10 bg-amber-400 rounded-xl flex items-center justify-center shadow-lg shadow-amber-200"
        >
          <span class="text-white text-xl font-bold">W</span>
        </div>
        <span class="text-xl font-bold text-slate-800 tracking-tight"
          >wordigo <span class="text-amber-500">Puzzle</span></span
        >
      </div>
      <button
        onclick="window.location.href = 'dashboard.html'"
        class="px-4 py-2 text-slate-600 hover:bg-slate-50 rounded-xl transition font-medium"
      >
        ← Panele Dön
      </button>
    </header>

    <main class="flex-1 flex flex-col items-center justify-center p-4">
      <div
        class="bg-white p-8 rounded-[40px] shadow-sm border border-slate-100 w-full max-w-md text-center"
      >
        <div class="mb-8">
          <h2 class="text-2xl font-bold text-slate-800">Kelimeyi Tahmin Et</h2>
          <p class="text-slate-500 text-sm mt-1">
            Öğrendiğin 5 harfli kelimelerden biri seçildi.
          </p>
        </div>

        <div
          id="game-grid"
          class="grid grid-cols-5 grid-rows-6 gap-2 mb-8 mx-auto w-fit"
        ></div>

        <div id="keyboard" class="grid gap-2 max-w-sm mx-auto">
          <p class="text-[10px] text-slate-400 uppercase tracking-widest">
            Klavyenizi kullanarak yazın
          </p>
        </div>

        <div id="game-status" class="mt-6 font-bold text-lg hidden"></div>
      </div>
    </main>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/wordle.js"></script>
  </body>
</html>
