<!DOCTYPE html>
<html lang="tr">
  <head>
    <link rel="icon" href="assets/wordigo-icon.png" type="image/png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wordigo - Sözlük</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
      }
      aside::-webkit-scrollbar {
        display: none;
      }
      aside {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body class="bg-slate-50">
    <div class="flex min-h-screen">
      
      <aside
        class="w-72 bg-white border-r border-slate-200 hidden md:flex flex-col sticky top-0 h-screen overflow-y-auto no-print shadow-sm"
      >
        <div class="p-6">
          <div class="flex items-center gap-3 px-2">
            <div
              class="w-10 h-10 bg-amber-400 rounded-xl flex items-center justify-center shadow-lg shadow-amber-200"
            >
              <span class="text-white text-xl font-bold">W</span>
            </div>
            <span class="text-xl font-bold text-slate-800 tracking-tight">wordigo</span>
          </div>
        </div>

        <nav class="px-4 space-y-1 mb-8">
          <a
            href="dashboard.html"
            class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-50 rounded-xl transition font-medium"
            >🏠 Ana Sayfa</a
          >
          <a
            href="dictionary.html"
            class="flex items-center gap-3 px-4 py-3 text-amber-600 bg-amber-50 rounded-xl font-semibold transition"
            >📖 Sözlük</a>
          <a
            href="add-word.html"
            class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-50 rounded-xl transition font-medium"
            >➕ Kelime Ekle</a
          >
          <a
  href="settings.html"
  class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-50 rounded-xl transition font-medium"
>
  ⚙️ Ayarlar
</a>  
        </nav>

        <div class="px-4 mb-4 mt-auto">
          <a
            href="word-chain.html"
            class="group block bg-gradient-to-br from-indigo-500 to-purple-600 rounded-3xl p-5 text-white relative overflow-hidden shadow-lg shadow-indigo-200/50 transition-all duration-300 hover:-translate-y-1"
          >
            <div class="absolute -right-4 -top-4 w-24 h-24 bg-white/10 rounded-full blur-xl transition-transform group-hover:scale-150"></div>
            
            <h4 class="text-[10px] font-bold text-indigo-100 uppercase tracking-widest mb-1">✨ Yapay Zeka</h4>
            <h3 class="text-xl font-bold mb-1">Word Chain</h3>
            <p class="text-xs text-indigo-50/90 font-medium leading-relaxed mb-4">
              Kelime Zinciri ile bir hikaye oluştur.
            </p>
            
            <div class="flex items-center justify-between">
              <span class="text-2xl group-hover:rotate-12 transition-transform duration-300">🤖</span>
              <span class="bg-white/20 backdrop-blur-md px-3 py-2 rounded-xl text-[11px] font-bold shadow-sm group-hover:bg-white/30 transition-colors">
                Hikaye Oluştur
              </span>
            </div>
          </a>
        </div>

        <div class="p-4 border-t border-slate-100">
          <button
            id="logoutBtn"
            class="w-full flex items-center gap-3 px-4 py-3 text-red-500 hover:bg-red-50 rounded-xl transition font-medium"
          >
            🚪 Oturumu Kapat
          </button>
        </div>
      </aside>

      <main class="flex-1 overflow-x-hidden">
        <header
          class="h-20 bg-white/80 backdrop-blur-md border-b border-slate-200 flex items-center justify-between px-8 sticky top-0 z-10 no-print"
        >
          <h1 class="text-xl font-semibold text-slate-800">
            <span class="text-amber-500">Sözlük</span> 
          </h1>
        </header>

        <div class="p-8 max-w-6xl mx-auto space-y-8">
          
          <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="relative md:col-span-2">
              <span class="absolute inset-y-0 left-4 flex items-center text-slate-400 text-lg">🔍</span>
              <input 
                type="text" 
                id="vocabSearch" 
                placeholder="Kelime ara..." 
                class="w-full pl-12 pr-4 py-4 bg-white border border-slate-200 rounded-[24px] shadow-sm focus:outline-none focus:border-amber-400 text-sm text-slate-700 placeholder-slate-400 transition"
              >
            </div>
            
            <div class="flex bg-white border border-slate-200 p-1.5 rounded-[24px] shadow-sm items-center h-[54px]">
              <button 
                id="filterAll" 
                class="flex-1 h-full text-xs font-bold bg-amber-400 text-white rounded-xl shadow-md shadow-amber-100 transition duration-200"
              >
                Tümü
              </button>
              <button 
                id="filterLearned" 
                class="flex-1 h-full text-xs font-semibold text-slate-500 hover:text-slate-800 rounded-xl transition duration-200"
              >
                Öğrenilenler
              </button>
            </div>
          </div>

          <div 
            id="dictionaryGrid" 
            class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5 items-start"
          >
            <div class="col-span-full py-16 text-center text-slate-400 italic bg-white rounded-3xl border border-slate-100 shadow-sm">
              Kelimeler yükleniyor... ⏳
            </div>
          </div>

        </div>
      </main>
    </div>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/dictionary.js"></script>
  </body>
</html>
