<!doctype html>
<html lang="tr">
  <head>
    <link rel="icon" href="assets/wordigo-icon.png" type="image/png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wordigo - Giriş Yap</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-slate-50 flex items-center justify-center min-h-screen p-4">
    <div
      class="login-container w-full max-w-[450px] bg-white rounded-[2rem] shadow-2xl shadow-slate-200/50 border border-slate-100 overflow-hidden"
    >
      <div class="h-2 bg-amber-400 w-full"></div>

      <div class="p-10">
        <div class="flex flex-col items-center mb-10">
          <div
            class="w-14 h-14 bg-amber-400 rounded-2xl flex items-center justify-center shadow-lg shadow-amber-200 mb-4"
          >
            <span class="text-white text-2xl font-bold">W</span>
          </div>
          <h1 class="text-2xl font-bold text-slate-800">wordigo</h1>
          <p class="text-slate-500 text-sm">Öğrenme macerasına devam et</p>
        </div>

        <form id="loginForm" class="space-y-6">
          <div class="space-y-2">
            <label class="text-sm font-semibold text-slate-700 ml-1"
              >Kullanıcı Adı</label
            >
            <input
              type="text"
              id="username"
              required
              class="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-amber-400 focus:border-transparent outline-none transition-all placeholder:text-slate-400"
              placeholder="kullanici_adi"
            />
          </div>

          <div class="space-y-2">
            <div class="flex justify-between items-center ml-1">
              <label class="text-sm font-semibold text-slate-700">Şifre</label>

              <a
                href="#"
                id="forgotPasswordBtn"
                class="text-sm font-bold text-amber-500 hover:text-amber-600 transition"
                >Şifremi Unuttum</a
              >
            </div>
            <input
              type="password"
              id="password"
              required
              class="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-amber-400 focus:border-transparent outline-none transition-all placeholder:text-slate-400"
              placeholder="••••••••"
            />
          </div>

          <button
            type="submit"
            class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-4 rounded-2xl transition-all shadow-lg shadow-slate-200 flex items-center justify-center gap-2"
          >
            Giriş Yap
            <span class="text-xl">→</span>
          </button>
        </form>

        <div class="mt-8 text-center">
          <p class="text-sm text-slate-500">
            Henüz hesabın yok mu?
            <a
              href="register.html"
              class="text-amber-600 font-bold hover:underline"
              >Ücretsiz Kayıt Ol</a
            >
          </p>
        </div>
      </div>
    </div>
    <script src="js/config.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
