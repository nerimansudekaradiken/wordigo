<!doctype html>
<html lang="tr">
  <head>
    <link rel="icon" href="assets/wordigo-icon.png" type="image/png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wordigo - Kişisel Analiz Raporu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
      }
      /* Yazdırma (Print) Modu İçin Özel Ayarlar */
      @media print {
        body {
          background-color: white !important;
        }
        .no-print {
          display: none !important;
        }
        .print-border {
          border: 1px solid #e2e8f0 !important;
          box-shadow: none !important;
        }
        .print-text-black {
          color: black !important;
        }
      }
    </style>
  </head>
  <body class="bg-slate-50 min-h-screen py-10 px-4 flex justify-center">
    <div
      class="w-full max-w-3xl bg-white rounded-[40px] shadow-sm border border-slate-100 p-10 print:p-0 print:border-none print:shadow-none"
    >
      <div class="flex items-center justify-between mb-10 no-print">
        <button
  onclick="window.location.href='dashboard.html'"
  class="flex items-center gap-2 px-4 py-2 text-slate-600 hover:bg-slate-50 rounded-xl transition font-medium"
>
  ← Geri Dön
</button>
        <button
          id="printReportBtn"
          class="flex items-center gap-2 bg-slate-900 hover:bg-slate-800 text-white px-6 py-2 rounded-xl transition font-bold shadow-lg shadow-slate-200"
        >
          🖨️ PDF Olarak Kaydet
        </button>
      </div>

      <div
        class="border-b-2 border-amber-400 pb-6 mb-8 flex justify-between items-end"
      >
        <div>
          <div class="flex items-center gap-3 mb-2">
            <div
              class="w-8 h-8 bg-amber-400 rounded-lg flex items-center justify-center"
            >
              <span class="text-white font-bold">W</span>
            </div>
            <span class="text-lg font-bold text-slate-800 tracking-tight"
              >wordigo</span
            >
          </div>
          <h1 class="text-3xl font-bold text-slate-900 print-text-black">
            Kişisel Gelişim ve Analiz Raporu
          </h1>
          <p class="text-slate-500 mt-2">
            Kullanıcı:
            <strong id="report-user" class="text-slate-700">Misafir</strong>
          </p>
        </div>
        <div class="text-right">
          <p
            class="text-sm font-semibold text-slate-400 uppercase tracking-widest mb-1"
          >
            Rapor Tarihi
          </p>
          <p
            id="report-date"
            class="font-bold text-slate-800 print-text-black"
          ></p>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-6 mb-8">
        <div class="bg-slate-50 p-6 rounded-3xl print-border">
          <p class="text-slate-500 text-sm font-medium mb-1">
            Havuzdaki Toplam Kelime
          </p>
          <h3
            id="totalWords"
            class="text-4xl font-bold text-slate-800 print-text-black"
          >
            0
          </h3>
        </div>

        <div
          class="bg-amber-50 p-6 rounded-3xl border border-amber-100 print-border"
        >
          <p class="text-amber-700 text-sm font-medium mb-1">
            Öğrenilen Kelime (Seviye 6)
          </p>
          <h3
            id="learnedWords"
            class="text-4xl font-bold text-amber-600 print-text-black"
          >
            0
          </h3>
        </div>

        <div class="bg-slate-50 p-6 rounded-3xl print-border">
          <p class="text-slate-500 text-sm font-medium mb-1">
            Toplam Hatalı Cevap
          </p>
          <h3
            id="wrongAnswers"
            class="text-4xl font-bold text-red-500 print-text-black"
          >
            0
          </h3>
        </div>

        <div class="bg-slate-900 p-6 rounded-3xl print-border">
          <p class="text-slate-400 text-sm font-medium mb-1">
            Genel Başarı Oranı
          </p>
          <h3
            id="successRate"
            class="text-4xl font-bold text-white print-text-black"
          >
            %0
          </h3>
        </div>
      </div>

      <div class="mt-12 pt-6 border-t border-slate-100 text-center">
        <p class="text-xs text-slate-400 italic">
          Bu rapor Wordigo Akıllı Kelime Ezberleme Sistemi tarafından otomatik
          olarak oluşturulmuştur.
        </p>
      </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/report.js"></script>
  </body>
</html>
