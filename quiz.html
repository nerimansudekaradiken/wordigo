<!doctype html>
<html lang="tr">
  <head>
    <link rel="icon" href="assets/wordigo-icon.png" type="image/png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wordigo - Günlük Sınav</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
      }
    </style>
  </head>
  <body class="bg-slate-50 min-h-screen">
    <div class="max-w-2xl mx-auto px-6 py-12">
      <div class="mb-10 text-center">
        <h1 class="text-2xl font-extrabold text-slate-800 mb-2">
          Günlük Kelime Testi
        </h1>
        <div class="w-full bg-slate-200 h-2 rounded-full overflow-hidden">
          <div
            id="progressBar"
            class="bg-amber-400 h-full transition-all duration-500"
            style="width: 0%"
          ></div>
        </div>
        <p
          id="progressText"
          class="text-xs font-bold text-slate-400 mt-2 uppercase tracking-widest"
        >
          Soru 0 / 0
        </p>
      </div>

      <div
        id="quizCard"
        class="bg-white rounded-[2.5rem] shadow-xl shadow-slate-200/50 p-10 border border-slate-100 text-center relative overflow-hidden"
      >
        <div
          id="wordImageContainer"
          class="w-32 h-32 mx-auto mb-6 rounded-3xl overflow-hidden bg-slate-50 border-4 border-white shadow-sm hidden"
        >
          <img id="wordImage" src="" class="w-full h-full object-cover" />
        </div>

        <h2
          id="questionWord"
          class="text-4xl font-black text-slate-800 mb-4 tracking-tight"
        >
          ---
        </h2>

        <div
          id="hintContainer"
          class="hidden mb-8 p-4 bg-amber-50 rounded-2xl border-l-4 border-amber-400"
        >
          <p
            id="sampleSentence"
            class="text-sm text-amber-900 italic font-medium"
          ></p>
        </div>

        <div id="optionsGrid" class="grid grid-cols-1 gap-4"></div>

        <button
          id="hintBtn"
          class="mt-8 text-sm font-bold text-slate-400 hover:text-amber-500 transition"
        >
          💡 İpucu Göster (Cümle)
        </button>
      </div>

      <div
        id="resultScreen"
        class="hidden text-center bg-white p-10 rounded-[2.5rem] shadow-xl"
      >
        <div class="text-6xl mb-4">🎉</div>
        <h2 class="text-3xl font-bold text-slate-800 mb-2">
          Sınav Tamamlandı!
        </h2>
        <p class="text-slate-500 mb-8">
          Yeni kelimeler hafızana başarıyla işlendi.
        </p>
        <button
          onclick="window.location.href = 'dashboard.html'"
          class="w-full py-4 bg-slate-900 text-white font-bold rounded-2xl"
        >
          Panele Dön
        </button>
      </div>
    </div>

    <script src="js/quiz.js"></script>
  </body>
</html>
