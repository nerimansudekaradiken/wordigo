<!doctype html>
<html lang="tr">
  <head>
    <link rel="icon" href="assets/wordigo-icon.png" type="image/png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wordigo - Kelime Ekle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
      }
      /* Sidebar kaydırma çubuğunu gizleme */
      aside::-webkit-scrollbar {
        display: none;
      }
      aside {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body class="bg-slate-50">
    <div class="flex min-h-screen">
      <aside
        class="w-72 bg-white border-r border-slate-200 hidden md:flex flex-col sticky top-0 h-screen overflow-y-auto no-print shadow-sm"
      >
        <div class="p-6">
          <div class="flex items-center gap-3 px-2">
            <div
              class="w-10 h-10 bg-amber-400 rounded-xl flex items-center justify-center shadow-lg shadow-amber-200"
            >
              <span class="text-white text-xl font-bold">W</span>
            </div>
            <span class="text-xl font-bold text-slate-800 tracking-tight"
              >wordigo</span
            >
          </div>
        </div>

        <nav class="px-4 space-y-1 mb-8">
          <a
            href="dashboard.html"
            class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-50 rounded-xl transition"
            >🏠 Panel</a
          >
          <a
            href="add-word.html"
            class="flex items-center gap-3 px-4 py-3 text-amber-600 bg-amber-50 rounded-xl font-semibold transition"
            >➕ Kelime Ekle</a
          >
        </nav>

        <div class="px-4 mb-4 mt-auto">
          <div
            class="bg-slate-900 rounded-3xl p-5 text-white relative overflow-hidden shadow-xl"
          >
            <div
              class="absolute -right-4 -bottom-4 w-24 h-24 bg-white/5 rounded-full"
            ></div>

            <h4
              class="text-[10px] font-semibold text-slate-400 uppercase tracking-widest mb-4 flex justify-between items-center"
            >
              <a
                href="report.html"
                class="flex items-center gap-2 hover:text-amber-400 transition cursor-pointer"
                title="Detaylı Rapora Git"
              >
                📊 Analiz Raporu
              </a>
              <a
                href="report.html"
                class="hover:text-white transition text-sm"
                title="Raporu Tam Ekran Aç"
              >
                ↗️
              </a>
            </h4>

            <div class="space-y-4">
              <div
                class="flex justify-between items-center border-b border-slate-800 pb-2"
              >
                <span class="text-sm text-slate-300">Toplam Kelime</span>
                <span id="totalWords" class="font-bold text-lg">0</span>
              </div>
              <div
                class="flex justify-between items-center border-b border-slate-800 pb-2"
              >
                <span class="text-sm text-slate-300">Öğrenilen</span>
                <span id="learnedWords" class="font-bold text-lg text-amber-400"
                  >0</span
                >
              </div>
              <div
                class="flex justify-between items-center border-b border-slate-800 pb-2"
              >
                <span class="text-sm text-slate-300">Hatalı Cevap</span>
                <span id="wrongAnswers" class="font-bold text-lg text-red-400"
                  >0</span
                >
              </div>
              <div class="pt-2">
                <div class="flex justify-between text-sm mb-1">
                  <span class="text-slate-300">Başarı Oranı</span>
                  <span id="successRate" class="font-bold text-xl text-white"
                    >%0</span
                  >
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="p-4 border-t border-slate-100">
          <button
            id="logoutBtn"
            class="w-full flex items-center gap-3 px-4 py-3 text-red-500 hover:bg-red-50 rounded-xl transition font-medium"
          >
            🚪 Oturumu Kapat
          </button>
        </div>
      </aside>

      <main class="flex-1 p-8">
        <div class="max-w-4xl mx-auto">
          <header class="mb-8">
            <h1 class="text-3xl font-bold text-slate-800">Yeni Kelime Ekle</h1>
            <p class="text-slate-500">
              Hafızana yeni bir değer katmaya hazır mısın?
            </p>
          </header>

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <form
              id="addWordForm"
              class="bg-white p-8 rounded-3xl shadow-sm border border-slate-100 space-y-6"
            >
              <div>
                <label class="block text-sm font-bold text-slate-700 mb-2"
                  >İngilizce Kelime</label
                >
                <input
                  type="text"
                  id="engWord"
                  required
                  placeholder="Örn: Resilience"
                  class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-amber-400 focus:ring-2 focus:ring-amber-100 outline-none transition"
                />
              </div>

              <div>
                <label class="block text-sm font-bold text-slate-700 mb-2"
                  >Türkçe Karşılığı</label
                >
                <input
                  type="text"
                  id="turWord"
                  required
                  placeholder="Örn: Direnç"
                  class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-amber-400 focus:ring-2 focus:ring-amber-100 outline-none transition"
                />
              </div>

              <div>
                <label class="block text-sm font-bold text-slate-700 mb-2"
                  >Örnek Cümle</label
                >
                <textarea
                  id="sentence"
                  rows="3"
                  placeholder="Kelimeyi bir cümle içinde kullan..."
                  class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-amber-400 focus:ring-2 focus:ring-amber-100 outline-none transition"
                ></textarea>
              </div>

              <div>
                <label class="block text-sm font-bold text-slate-700 mb-2"
                  >Resim URL (Opsiyonel)</label
                >
                <input
                  type="text"
                  id="picUrl"
                  placeholder="https://resim-adresi.com/resim.jpg"
                  class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-amber-400 focus:ring-2 focus:ring-amber-100 outline-none transition"
                />
              </div>

              <button
                type="submit"
                class="w-full py-4 bg-amber-400 text-white font-bold rounded-2xl hover:bg-amber-500 shadow-lg shadow-amber-100 transition-all transform active:scale-95"
              >
                Kelimeyi Havuza Ekle
              </button>
            </form>

            <div class="hidden lg:block">
              <p
                class="text-sm font-bold text-slate-400 mb-4 uppercase tracking-widest text-center"
              >
                Kart Önizlemesi
              </p>
              <div
                class="bg-white p-6 rounded-[2rem] shadow-xl border border-slate-100 sticky top-8"
              >
                <div
                  id="previewPic"
                  class="w-full aspect-video bg-slate-100 rounded-2xl mb-6 overflow-hidden flex items-center justify-center text-slate-300"
                >
                  <span>Resim Önizlemesi</span>
                </div>
                <h2
                  id="previewEng"
                  class="text-2xl font-black text-slate-800 mb-1"
                >
                  Kelime Adı
                </h2>
                <p id="previewTur" class="text-amber-600 font-bold mb-4">
                  Anlamı
                </p>
                <div
                  class="p-4 bg-amber-50 rounded-xl border-l-4 border-amber-400"
                >
                  <p id="previewSentence" class="text-sm text-slate-700 italic">
                    "Örnek cümle burada görünecek."
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
    <script src="js/add-word.js"></script>
  </body>
</html>
